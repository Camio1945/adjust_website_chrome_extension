                    - cell [ref=e500]:
                      - generic "查询门店下商品列表</br>入参参数定义（QueryProductManageAbilityRequest request）</br>1.stationNo和outStationNo必填其中一项</br> 2.如果根据商品名称查询，skuName必填；如果根据id查询，outSuperId和superId必传其中一项 或 skuId和outSkuId必传其中一项</br> 3.只有根据商品名称查询，pageSize必传，且必须 <=10</br> 4.searchAfterId首次查询时可为null，后续查询取查询结果的最后1条结果的skuId</br> 5.终止条件：通过出参返回结果数量和pageSize来进行判断是否终止，当出参返回结果数量 < pageSize时终止 </br> 6.查询优先级：6.1 > 6.2 > 6.3 > 6.4</br> 6.1.skuId/outSkuId+stationNo/outStationNo</br> 6.2.spuId/outSpuId+stationNo/outStationNo</br> 6.3.skuName+stationNo/outStationNo+pageSize+searchAfterId</br> 6.4.stationNo/outStationNo+pageSize+searchAfterId" [ref=e502]: 查询门店下商品列表入参参数定义（QueryProductManageAbilityRequest request）1.stationNo和outStationNo必填其中一项 2.如果根据商品名称查询，skuName必填；如果根据id查询，outSuperId和superId必传其中一项 或 skuId和outSkuId必传其中一项 3.只有根据商品名称查询，pageSize必传，且必须 <=10 4.searchAfterId首次查询时可为null，后续查询取查询结果的最后1条结果的skuId 5.终止条件：通过出参返回结果数量和pageSize来进行判断是否终止，当出参返回结果数量 < pageSize时终止 6.查询优先级：6.1 > 6.2 > 6.3 > 6.4 6.1.skuId/outSkuId+stationNo/outStationNo 6.2.spuId/outSpuId+stationNo/outStationNo 6.3.skuName+stationNo/outStationNo+pageSize+searchAfterId 6.4.stationNo/outStationNo+pageSize+searchAfterId
